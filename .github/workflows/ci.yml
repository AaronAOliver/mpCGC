name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint Nextflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Nextflow
        run: |
          curl -fsSL -o nextflow \
            https://github.com/nextflow-io/nextflow/releases/latest/download/nextflow
          chmod +x nextflow
          sudo mv nextflow /usr/local/bin/
          nextflow -v
      - name: Lint scripts and configs
        run: nextflow lint .

  envs:
    name: Conda environments solve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dbcan, pydata, network, phylo, rggtree]
    steps:
      - uses: actions/checkout@v5
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-activate-base: true
          activate-environment: ""
      - name: Solve env/${{ matrix.env }}.yml (dry run)
        shell: bash -el {0}
        run: conda env create --dry-run --file env/${{ matrix.env }}.yml -p "$RUNNER_TEMP/${{ matrix.env }}"

  stub:
    name: Workflow stub run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Nextflow
        run: |
          curl -fsSL -o nextflow \
            https://github.com/nextflow-io/nextflow/releases/latest/download/nextflow
          chmod +x nextflow
          sudo mv nextflow /usr/local/bin/
      # stubs stand in for every tool, so no software profile or database is
      # needed; this checks that the three dataflows wire together
      - name: Stub run, all dataflows
        run: |
          mkdir -p empty_db
          nextflow run . -profile test_full -stub-run --db empty_db --outdir stub_results

  estimators:
    name: Diversity estimators vs iNEXT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install numpy scipy
      # expected values come from iNEXT 3.0.2 in R and are stored in the test,
      # so this needs no R installation
      - run: python test/test_inext.py

  scripts:
    name: Compile bin scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install numpy scipy pandas
      - name: Byte-compile
        run: python -m compileall -q bin test
      # Nextflow runs bin/ scripts directly, so they must be committed as
      # executable (git on Windows does not record the bit by itself). Only
      # tracked files are checked: the byte-compile step above leaves an
      # untracked bin/__pycache__/ behind.
      - name: Scripts are executable
        run: |
          git ls-files -s bin | awk '$1 != "100755" { print "not executable in git: " $4; bad = 1 } END { exit bad }'
      - name: Every script answers --help
        run: |
          for f in bin/mpcgc_*.py; do
            echo "--- $f"
            python "$f" --help > /dev/null
          done
