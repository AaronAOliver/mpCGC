# dbCAN and everything it calls (Pyrodigal, DIAMOND, PyHMMER). Only dbCAN is
# pinned: it declares the versions of its own dependencies, and pinning them by
# hand as well is what stopped this file from solving as packages moved on.
# The versions actually used are recorded in pipeline_info/ for every run.
name: mpcgc-dbcan
channels:
  - conda-forge
  - bioconda
dependencies:
  - dbcan=5.2.9
